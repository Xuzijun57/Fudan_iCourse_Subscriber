name: Audio diagnostic
on:
  workflow_dispatch:
    inputs:
      course_ids:
        required: true
        type: string
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pycryptodome numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m unittest discover -s tests -v
      - run: python -u scripts/diagnose_audio.py
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          COURSE_IDS: ${{ secrets.COURSE_IDS }}
